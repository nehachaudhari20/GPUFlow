syntax = "proto3";

package gpuflow;

service Scheduler {
    // Node Registration
    rpc RegisterNode (RegisterNodeRequest) returns (RegisterNodeResponse) {}
    
    // Heartbeat
    rpc SendHeartbeat (HeartbeatRequest) returns (HeartbeatResponse) {}

    // Task submission
    rpc SubmitTask (TaskRequest) returns (TaskResponse) {}
}

message RegisterNodeRequest {
    string node_id = 1;
    string hostname = 2;
    float cpu_total = 3;
    float ram_total = 4;
    float gpu_total = 5;
    float gpu_memory_total = 6;
}

message RegisterNodeResponse {
    bool success = 1;
    string message = 2;
}

message HeartbeatRequest {
    string node_id = 1;
    string status = 2;
    int64 timestamp = 3;
    float cpu_available = 4;
    float ram_available = 5;
    float gpu_available = 6;
    float gpu_memory_available = 7;
}

message HeartbeatResponse {
    bool acknowledged = 1;
}

message TaskRequest {
    string task_id = 1;
    float cpu_req = 2;
    float gpu_req = 3;
    float ram_req = 4;
}

message TaskResponse {
    bool accepted = 1;
    string message = 2;
}
