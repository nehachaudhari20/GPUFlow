syntax = "proto3";

package gpuflow;

service WorkerNode {
    // Basic heartbeat to scheduler
    rpc SendHeartbeat (HeartbeatRequest) returns (HeartbeatResponse) {}
}

service Scheduler {
    // Task submission
    rpc SubmitTask (TaskRequest) returns (TaskResponse) {}
}

message HeartbeatRequest {
    string worker_id = 1;
    string status = 2;
}

message HeartbeatResponse {
    bool acknowledged = 1;
}

message TaskRequest {
    string task_id = 1;
    float cpu_req = 2;
    float gpu_req = 3;
    float ram_req = 4;
}

message TaskResponse {
    bool accepted = 1;
    string message = 2;
}
