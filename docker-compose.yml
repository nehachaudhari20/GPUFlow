services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - MONGO_URI=mongodb://mongodb:27017/gpuflow
      - GRPC_PORT=50051
    ports:
      - "8000:8000"
      - "50051:50051"
    depends_on:
      - mongodb
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"

  worker-1:
    build:
      context: .
      dockerfile: backend/Dockerfile
    hostname: worker-1
    environment:
      - SIMULATE_GPUS=True
      - SIMULATED_GPU_COUNT=8.0
      - SIMULATED_GPU_MEMORY_GB=32.0
      - SCHEDULER_ADDRESS=backend:50051
      - WORKER_HOSTNAME=worker-1
    command: ["python", "backend/app/worker/node.py"]
    depends_on:
      - backend

  worker-2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    hostname: worker-2
    environment:
      - SIMULATE_GPUS=True
      - SIMULATED_GPU_COUNT=2.0
      - SIMULATED_GPU_MEMORY_GB=8.0
      - SCHEDULER_ADDRESS=backend:50051
      - WORKER_HOSTNAME=worker-2
    command: ["python", "backend/app/worker/node.py"]
    depends_on:
      - backend

  worker-3:
    build:
      context: .
      dockerfile: backend/Dockerfile
    hostname: worker-3
    environment:
      - SIMULATE_GPUS=True
      - SIMULATED_GPU_COUNT=1.0
      - SIMULATED_GPU_MEMORY_GB=4.0
      - SCHEDULER_ADDRESS=backend:50051
      - WORKER_HOSTNAME=worker-3
    command: ["python", "backend/app/worker/node.py"]
    depends_on:
      - backend
